# 예시 인벤토리: 대상 서버를 그룹 swinventory_targets 에 넣는다.
[swinventory_targets:children]
linux_servers
windows_servers

[linux_servers]
web01.corp.example
db01.corp.example ansible_user=deploy

[windows_servers]
win-app01.corp.example

[windows_servers:vars]
ansible_connection=winrm
ansible_winrm_transport=ntlm            # 환경에 맞게(kerberos·credssp 등)
ansible_winrm_server_cert_validation=validate
ansible_user=Administrator
# ansible_password 는 ansible-vault 변수로 둔다
